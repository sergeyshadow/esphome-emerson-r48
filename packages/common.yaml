# packages/common.yaml
# Common controls, polling and automatic CAN recovery
#
# Required substitutions:
#   can_tx_pin, can_rx_pin  — numeric GPIO (e.g. "6", "10")
#   psu1_command_id, psu2_command_id, psu3_command_id

globals:
  - id: can_fail_count
    type: int
    restore_value: no
    initial_value: '0'

button:
  - platform: template
    name: "CAN Hard Reset"
    id: can_hard_reset
    icon: mdi:reload
    on_press:
      - lambda: |-
          twai_stop();
          twai_driver_uninstall();
          delay(150);

          twai_general_config_t g_config = TWAI_GENERAL_CONFIG_DEFAULT(
              (gpio_num_t)${can_tx_pin}, (gpio_num_t)${can_rx_pin}, TWAI_MODE_NORMAL);
          twai_timing_config_t t_config = TWAI_TIMING_CONFIG_125KBITS();
          twai_filter_config_t f_config = TWAI_FILTER_CONFIG_ACCEPT_ALL();

          if (twai_driver_install(&g_config, &t_config, &f_config) == ESP_OK) {
            twai_start();
            ESP_LOGI("can", "CAN driver fully reinstalled");
            id(last_can_ok) = millis();
            id(can_fail_count) = 0;
          } else {
            ESP_LOGE("can", "Failed to reinstall CAN driver");
          }

  - platform: template
    name: "Show Detected Modules"
    id: show_detected_modules
    icon: mdi:information-outline
    on_press:
      - lambda: |-
          ESP_LOGI("psu", "========== Currently known modules ==========");
          if (id(seen_modules).empty()) {
            ESP_LOGW("psu", "No modules detected yet");
          } else {
            for (uint32_t hb : id(seen_modules)) {
              uint8_t low = hb & 0xFF;
              uint32_t response_id = 0x060F8000 | ((low + 4) & 0xFF);
              uint32_t command_id  = 0x06080000 | (uint32_t(low + 4) << 8) | 0x83;

              ESP_LOGI("psu", "Heartbeat : 0x%08X", (unsigned int)hb);
              ESP_LOGI("psu", "Response  : 0x%08X", (unsigned int)response_id);
              ESP_LOGI("psu", "Command   : 0x%08X", (unsigned int)command_id);
              ESP_LOGI("psu", "-------------------------------------------");
            }
          }
          ESP_LOGI("psu", "=============================================");

switch:
  - platform: restart
    name: "Restart"
    id: restart_switch

interval:
  - interval: 3s
    then:
      - canbus.send:
          canbus_id: can_bus
          use_extended_id: true
          can_id: ${psu1_command_id}
          data: [0x00, 0xF0, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]
      - delay: 40ms
      - canbus.send:
          canbus_id: can_bus
          use_extended_id: true
          can_id: ${psu2_command_id}
          data: [0x00, 0xF0, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]
      - delay: 40ms
      - canbus.send:
          canbus_id: can_bus
          use_extended_id: true
          can_id: ${psu3_command_id}
          data: [0x00, 0xF0, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  - interval: 5s
    then:
      - lambda: |-
          uint32_t now = millis();

          if (id(last_can_ok) != 0 && (now - id(last_can_ok) < 20000)) {
            id(can_fail_count) = 0;
            return;
          }

          id(can_fail_count) += 1;

          if (id(can_fail_count) >= 4) {
            ESP_LOGW("can", "No CAN activity for too long, performing Hard Reset");

            twai_stop();
            twai_driver_uninstall();
            delay(150);

            twai_general_config_t g_config = TWAI_GENERAL_CONFIG_DEFAULT(
                (gpio_num_t)${can_tx_pin}, (gpio_num_t)${can_rx_pin}, TWAI_MODE_NORMAL);
            twai_timing_config_t t_config = TWAI_TIMING_CONFIG_125KBITS();
            twai_filter_config_t f_config = TWAI_FILTER_CONFIG_ACCEPT_ALL();

            if (twai_driver_install(&g_config, &t_config, &f_config) == ESP_OK) {
              twai_start();
              ESP_LOGI("can", "CAN driver automatically reinstalled");
            } else {
              ESP_LOGE("can", "Failed to reinstall CAN driver");
            }

            id(can_fail_count) = 0;
            id(last_can_ok) = millis();
          }