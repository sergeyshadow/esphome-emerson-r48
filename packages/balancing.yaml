# packages/balancing.yaml
# Split real DC load by AC voltage: weak phases are clamped,
# the strong phase gets headroom. If a module hits max current,
# leftover amps go to the others in proportion to Vin.

number:
  - platform: template
    name: "Total Power Limit"
    id: total_power_limit
    min_value: 100
    max_value: 9000
    step: 50
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    initial_value: 4000

  - platform: template
    name: "All PSUs Set Voltage"
    id: all_psu_set_voltage
    min_value: 43.0
    max_value: 58.0
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    set_action:
      - number.set:
          id: psu1_set_voltage
          value: !lambda "return x;"
      - number.set:
          id: psu2_set_voltage
          value: !lambda "return x;"
      - number.set:
          id: psu3_set_voltage
          value: !lambda "return x;"

switch:
  - platform: template
    name: "Balancing Enable"
    id: balancing_enable
    icon: mdi:scale-balance
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

interval:
  - interval: ${balance_interval}
    then:
      - if:
          condition:
            switch.is_on: balancing_enable
          then:
            - lambda: |-
                const uint32_t now = millis();
                const uint32_t stale_ms = 25000;

                bool a[3];
                a[0] = (id(last_ok_psu1) != 0) && (now - id(last_ok_psu1) < stale_ms)
                       && id(psu1_output_enable).state
                       && id(psu1_input_voltage).has_state();
                a[1] = (id(last_ok_psu2) != 0) && (now - id(last_ok_psu2) < stale_ms)
                       && id(psu2_output_enable).state
                       && id(psu2_input_voltage).has_state();
                a[2] = (id(last_ok_psu3) != 0) && (now - id(last_ok_psu3) < stale_ms)
                       && id(psu3_output_enable).state
                       && id(psu3_input_voltage).has_state();

                int n = (a[0] ? 1 : 0) + (a[1] ? 1 : 0) + (a[2] ? 1 : 0);
                if (n == 0) {
                  ESP_LOGD("balance", "No active modules, skip");
                  return;
                }

                float vin[3] = {
                  a[0] ? id(psu1_input_voltage).state : 0.0f,
                  a[1] ? id(psu2_input_voltage).state : 0.0f,
                  a[2] ? id(psu3_input_voltage).state : 0.0f
                };
                float vout[3] = {
                  (a[0] && id(psu1_voltage).has_state()) ? id(psu1_voltage).state : 53.0f,
                  (a[1] && id(psu2_voltage).has_state()) ? id(psu2_voltage).state : 53.0f,
                  (a[2] && id(psu3_voltage).has_state()) ? id(psu3_voltage).state : 53.0f
                };
                float iact[3] = {
                  (a[0] && id(psu1_current).has_state()) ? id(psu1_current).state : 0.0f,
                  (a[1] && id(psu2_current).has_state()) ? id(psu2_current).state : 0.0f,
                  (a[2] && id(psu3_current).has_state()) ? id(psu3_current).state : 0.0f
                };

                float sum_vin = 0.0f, sum_iact = 0.0f, sum_p = 0.0f;
                for (int i = 0; i < 3; i++) {
                  if (!a[i]) continue;
                  if (vout[i] < 40.0f) vout[i] = 53.0f;
                  sum_vin += vin[i];
                  sum_iact += iact[i];
                  sum_p += vout[i] * iact[i];
                }
                if (sum_vin < 1.0f) return;

                float avg_vin = sum_vin / n;
                float eq = sum_iact / n;

                float deadband = ${balance_deadband};
                float gain     = ${balance_gain};
                float min_i    = ${balance_min_current};
                float max_i    = ${balance_max_current};
                float step     = ${balance_step};
                float send_d   = ${balance_send_delta};
                const float headroom = 1.5f;

                float t[3] = {-1.0f, -1.0f, -1.0f};
                bool sat[3] = {false, false, false};

                for (int i = 0; i < 3; i++) {
                  if (!a[i]) continue;
                  float adj = 0.0f;
                  if (n > 1 && fabsf(vin[i] - avg_vin) > deadband)
                    adj = (vin[i] - avg_vin) * gain;
                  t[i] = eq + adj;
                  if (vin[i] + 0.01f >= avg_vin)
                    t[i] += headroom;
                  if (t[i] < min_i) t[i] = min_i;
                  if (t[i] > max_i) {
                    t[i] = max_i;
                    sat[i] = true;
                  }
                }

                // If a module is at max current, give leftover to the others by Vin
                for (int pass = 0; pass < 2; pass++) {
                  float extra = 0.0f;
                  float wfree = 0.0f;
                  for (int i = 0; i < 3; i++) {
                    if (!a[i]) continue;
                    float raw = eq;
                    if (n > 1 && fabsf(vin[i] - avg_vin) > deadband)
                      raw += (vin[i] - avg_vin) * gain;
                    if (vin[i] + 0.01f >= avg_vin) raw += headroom;
                    if (raw > max_i) extra += raw - max_i;
                    if (!sat[i]) wfree += vin[i];
                  }
                  if (extra < 0.2f || wfree < 1.0f) break;
                  for (int i = 0; i < 3; i++) {
                    if (!a[i] || sat[i]) continue;
                    t[i] += extra * vin[i] / wfree;
                    if (t[i] > max_i) {
                      t[i] = max_i;
                      sat[i] = true;
                    }
                  }
                }

                // Total Power Limit ceiling
                float p_want = 0.0f;
                for (int i = 0; i < 3; i++)
                  if (a[i]) p_want += t[i] * vout[i];
                float p_cap = id(total_power_limit).state;
                if (p_want > p_cap && p_want > 1.0f) {
                  float k = p_cap / p_want;
                  for (int i = 0; i < 3; i++)
                    if (a[i]) t[i] *= k;
                }

                float cur[3] = {
                  id(psu1_set_current_limit).has_state() ? id(psu1_set_current_limit).state : eq,
                  id(psu2_set_current_limit).has_state() ? id(psu2_set_current_limit).state : eq,
                  id(psu3_set_current_limit).has_state() ? id(psu3_set_current_limit).state : eq
                };

                float out[3];
                for (int i = 0; i < 3; i++) {
                  if (!a[i]) { out[i] = -1.0f; continue; }
                  float d = t[i] - cur[i];
                  if (d > step) d = step;
                  if (d < -step) d = -step;
                  out[i] = cur[i] + d;
                }

                if (out[0] >= 0.0f && fabsf(out[0] - cur[0]) >= send_d)
                  id(psu1_set_current_limit).make_call().set_value(out[0]).perform();
                if (out[1] >= 0.0f && fabsf(out[1] - cur[1]) >= send_d)
                  id(psu2_set_current_limit).make_call().set_value(out[1]).perform();
                if (out[2] >= 0.0f && fabsf(out[2] - cur[2]) >= send_d)
                  id(psu3_set_current_limit).make_call().set_value(out[2]).perform();

                ESP_LOGD("balance",
                         "active=%d eq=%.2f I1=%.2f I2=%.2f I3=%.2f act=%.1f/%.1f/%.1f vin=%.1f/%.1f/%.1f p=%.0f",
                         n, eq, out[0], out[1], out[2],
                         iact[0], iact[1], iact[2], vin[0], vin[1], vin[2], sum_p);