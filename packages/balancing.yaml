# packages/balancing.yaml
# Share Total Power Limit by sag from the best AC phase.
# Sag <= deadband -> full weight. Sag >= 20 V -> weight 0 (min current).
# Linear in between. A module that hits max current does not dump
# its leftover onto a sagging phase; that budget stays unused.
#
# Runtime knobs (HA / web): deadband (full-weight window), min/max
# current, step, send delta. balance_interval is compile-time.
# Set Balance Deadband to 4 V for the agreed knee.
#
# Soft-start: a module without real AC (Vin < 120 V) is "off-grid".
# When Vin rises above 120 V its current limit snaps to min, then
# the normal step ramp takes over. R48 still talks CAN from the
# 48 V bus, so last_ok alone is not enough.

globals:
  - id: psu1_was_long_dead
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: psu2_was_long_dead
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: psu3_was_long_dead
    type: bool
    restore_value: no
    initial_value: 'true'

number:
  - platform: template
    name: "Total Power Limit"
    id: total_power_limit
    min_value: 100
    max_value: 9000
    step: 50
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    initial_value: 4000

  - platform: template
    name: "All PSUs Set Voltage"
    id: all_psu_set_voltage
    min_value: 43.0
    max_value: 58.0
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    set_action:
      - number.set:
          id: psu1_set_voltage
          value: !lambda "return x;"
      - number.set:
          id: psu2_set_voltage
          value: !lambda "return x;"
      - number.set:
          id: psu3_set_voltage
          value: !lambda "return x;"

  - platform: template
    name: "Balance Deadband"
    id: bal_deadband
    icon: mdi:arrow-expand-horizontal
    min_value: 0.5
    max_value: 15.0
    step: 0.5
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: ${balance_deadband}

  - platform: template
    name: "Balance Min Current"
    id: bal_min_current
    icon: mdi:current-dc
    min_value: 1.0
    max_value: 20.0
    step: 0.5
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: ${balance_min_current}

  - platform: template
    name: "Balance Max Current"
    id: bal_max_current
    icon: mdi:current-dc
    min_value: 10.0
    max_value: 60.0
    step: 1.0
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: ${balance_max_current}

  - platform: template
    name: "Balance Step"
    id: bal_step
    icon: mdi:stairs
    min_value: 0.5
    max_value: 10.0
    step: 0.5
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: ${balance_step}

  - platform: template
    name: "Balance Send Delta"
    id: bal_send_delta
    icon: mdi:swap-horizontal
    min_value: 0.2
    max_value: 5.0
    step: 0.1
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: ${balance_send_delta}

switch:
  - platform: template
    name: "Balancing Enable"
    id: balancing_enable
    icon: mdi:scale-balance
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

interval:
  - interval: ${balance_interval}
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t stale_ms = 25000;
          const float ac_min = 120.0f;
          const float zero_sag = 20.0f;

          uint32_t ok[3] = { id(last_ok_psu1), id(last_ok_psu2), id(last_ok_psu3) };
          float raw_vin[3] = {
            id(psu1_input_voltage).has_state() ? id(psu1_input_voltage).state : 0.0f,
            id(psu2_input_voltage).has_state() ? id(psu2_input_voltage).state : 0.0f,
            id(psu3_input_voltage).has_state() ? id(psu3_input_voltage).state : 0.0f
          };

          bool live[3];
          bool ac[3];
          for (int i = 0; i < 3; i++) {
            live[i] = (ok[i] != 0) && (now - ok[i] < stale_ms);
            ac[i] = live[i] && (raw_vin[i] > ac_min);
          }

          bool start[3];
          start[0] = ac[0] && id(psu1_was_long_dead);
          start[1] = ac[1] && id(psu2_was_long_dead);
          start[2] = ac[2] && id(psu3_was_long_dead);
          id(psu1_was_long_dead) = !ac[0];
          id(psu2_was_long_dead) = !ac[1];
          id(psu3_was_long_dead) = !ac[2];

          if (!id(balancing_enable).state) return;

          bool a[3] = { ac[0], ac[1], ac[2] };

          int n = (a[0] ? 1 : 0) + (a[1] ? 1 : 0) + (a[2] ? 1 : 0);
          if (n == 0) {
            ESP_LOGD("balance", "No active modules, skip");
            return;
          }

          float vin[3] = {
            a[0] ? id(psu1_input_voltage).state : 0.0f,
            a[1] ? id(psu2_input_voltage).state : 0.0f,
            a[2] ? id(psu3_input_voltage).state : 0.0f
          };
          float vout[3] = {
            (a[0] && id(psu1_voltage).has_state()) ? id(psu1_voltage).state : 53.0f,
            (a[1] && id(psu2_voltage).has_state()) ? id(psu2_voltage).state : 53.0f,
            (a[2] && id(psu3_voltage).has_state()) ? id(psu3_voltage).state : 53.0f
          };
          float iact[3] = {
            (a[0] && id(psu1_current).has_state()) ? id(psu1_current).state : 0.0f,
            (a[1] && id(psu2_current).has_state()) ? id(psu2_current).state : 0.0f,
            (a[2] && id(psu3_current).has_state()) ? id(psu3_current).state : 0.0f
          };

          float sum_iact = 0.0f, sum_p = 0.0f, sum_vout = 0.0f, best = 0.0f;
          for (int i = 0; i < 3; i++) {
            if (!a[i]) continue;
            if (vout[i] < 40.0f) vout[i] = 53.0f;
            sum_iact += iact[i];
            sum_p += vout[i] * iact[i];
            sum_vout += vout[i];
            if (vin[i] > best) best = vin[i];
          }
          if (best < 1.0f) return;

          float eq = sum_iact / n;
          float full_sag = id(bal_deadband).has_state() ? id(bal_deadband).state : ${balance_deadband};
          float min_i    = id(bal_min_current).has_state() ? id(bal_min_current).state : ${balance_min_current};
          float max_i    = id(bal_max_current).has_state() ? id(bal_max_current).state : ${balance_max_current};
          float step     = id(bal_step).has_state() ? id(bal_step).state : ${balance_step};
          float send_d   = id(bal_send_delta).has_state() ? id(bal_send_delta).state : ${balance_send_delta};
          if (step < 0.2f) step = 0.2f;
          if (max_i <= min_i) max_i = min_i + 1.0f;
          if (full_sag < 0.5f) full_sag = 0.5f;
          float span = zero_sag - full_sag;
          if (span < 1.0f) span = 1.0f;

          float w[3] = {0.0f, 0.0f, 0.0f};
          float wsum = 0.0f;
          for (int i = 0; i < 3; i++) {
            if (!a[i]) continue;
            float sag = best - vin[i];
            if (n == 1 || sag <= full_sag) w[i] = 1.0f;
            else if (sag >= zero_sag) w[i] = 0.0f;
            else w[i] = (zero_sag - sag) / span;
            wsum += w[i];
          }

          float t[3] = {-1.0f, -1.0f, -1.0f};
          float avg_vout = sum_vout / n;
          float budget = id(total_power_limit).state / avg_vout;
          if (budget < n * min_i) budget = n * min_i;

          float reserved = 0.0f;
          for (int i = 0; i < 3; i++) {
            if (!a[i] || w[i] > 0.001f) continue;
            t[i] = min_i;
            reserved += min_i;
          }

          float rest = budget - reserved;
          if (rest < 0.0f) rest = 0.0f;
          if (wsum < 0.001f) {
            for (int i = 0; i < 3; i++)
              if (a[i]) t[i] = min_i;
          } else {
            for (int i = 0; i < 3; i++) {
              if (!a[i] || w[i] <= 0.001f) continue;
              t[i] = rest * w[i] / wsum;
              if (t[i] < min_i) t[i] = min_i;
              if (t[i] > max_i) t[i] = max_i;
            }
          }

          float p_want = 0.0f;
          for (int i = 0; i < 3; i++)
            if (a[i]) p_want += t[i] * vout[i];
          float p_cap = id(total_power_limit).state;
          if (p_want > p_cap && p_want > 1.0f) {
            float k = p_cap / p_want;
            for (int i = 0; i < 3; i++)
              if (a[i]) t[i] *= k;
          }

          float cur[3] = {
            id(psu1_set_current_limit).has_state() ? id(psu1_set_current_limit).state : eq,
            id(psu2_set_current_limit).has_state() ? id(psu2_set_current_limit).state : eq,
            id(psu3_set_current_limit).has_state() ? id(psu3_set_current_limit).state : eq
          };

          for (int i = 0; i < 3; i++) {
            if (!a[i] || !start[i]) continue;
            t[i] = min_i;
            cur[i] = min_i;
            ESP_LOGI("balance", "PSU%d soft-start after long silence, limit=%.1f A", i + 1, min_i);
          }

          float out[3];
          for (int i = 0; i < 3; i++) {
            if (!a[i]) { out[i] = -1.0f; continue; }
            float d = t[i] - cur[i];
            if (d > step) d = step;
            if (d < -step) d = -step;
            out[i] = cur[i] + d;
          }

          if (out[0] >= 0.0f && (start[0] || fabsf(out[0] - cur[0]) >= send_d))
            id(psu1_set_current_limit).make_call().set_value(out[0]).perform();
          if (out[1] >= 0.0f && (start[1] || fabsf(out[1] - cur[1]) >= send_d))
            id(psu2_set_current_limit).make_call().set_value(out[1]).perform();
          if (out[2] >= 0.0f && (start[2] || fabsf(out[2] - cur[2]) >= send_d))
            id(psu3_set_current_limit).make_call().set_value(out[2]).perform();

          ESP_LOGD("balance",
                   "active=%d best=%.1f I1=%.2f I2=%.2f I3=%.2f w=%.2f/%.2f/%.2f act=%.1f/%.1f/%.1f vin=%.1f/%.1f/%.1f p=%.0f",
                   n, best, out[0], out[1], out[2],
                   w[0], w[1], w[2],
                   iact[0], iact[1], iact[2], vin[0], vin[1], vin[2], sum_p);