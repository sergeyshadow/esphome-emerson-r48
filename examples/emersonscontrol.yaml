# examples/emersonscontrol.yaml
# Ready-to-use example for up to 3 Emerson R48 rectifiers
#
# Usage:
# 1. Copy this file into your ESPHome config
# 2. Adjust substitutions (pins as numbers + module IDs)
# 3. Flash once → open logs → press "Show Detected Modules"
# 4. Put the printed IDs into substitutions and re-flash

substitutions:
  # Hardware — numeric GPIO only (required for TWAI Hard Reset)
  can_tx_pin: "6"
  can_rx_pin: "10"

  # Module 1
  psu1_prefix: psu1
  psu1_name: "PSU1"
  psu1_command_id: "0x06080783"
  psu1_response_id: "0x060F8007"

  # Module 2
  psu2_prefix: psu2
  psu2_name: "PSU2"
  psu2_command_id: "0x06080F83"
  psu2_response_id: "0x060F800F"

  # Module 3
  psu3_prefix: psu3
  psu3_name: "PSU3"
  psu3_command_id: "0x06081783"
  psu3_response_id: "0x060F8017"

  # Balancing parameters
  balance_deadband: "2.0"
  balance_gain: "1.5"
  balance_min_current: "2.0"
  balance_max_current: "55.0"
  balance_interval: "3s"

esphome:
  name: emersonscontrol
  friendly_name: EmersonsControl

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: EmersonsControl Fallback Hotspot
    password: "changeme"

web_server:
  port: 80
  version: 3

captive_portal:

packages:
  can_bus:
    url: https://github.com/sergeyshadow/esphome-emerson-r48
    ref: main
    files: [packages/can_bus.yaml]
    refresh: 0s

  common:
    url: https://github.com/sergeyshadow/esphome-emerson-r48
    ref: main
    files: [packages/common.yaml]
    refresh: 0s

  balancing:
    url: https://github.com/sergeyshadow/esphome-emerson-r48
    ref: main
    files: [packages/balancing.yaml]
    refresh: 0s

  psu1:
    url: https://github.com/sergeyshadow/esphome-emerson-r48
    ref: main
    files:
      - path: packages/psu.yaml
        vars:
          prefix: ${psu1_prefix}
          name: ${psu1_name}
          command_id: ${psu1_command_id}
          response_id: ${psu1_response_id}
    refresh: 0s

  psu2:
    url: https://github.com/sergeyshadow/esphome-emerson-r48
    ref: main
    files:
      - path: packages/psu.yaml
        vars:
          prefix: ${psu2_prefix}
          name: ${psu2_name}
          command_id: ${psu2_command_id}
          response_id: ${psu2_response_id}
    refresh: 0s

  psu3:
    url: https://github.com/sergeyshadow/esphome-emerson-r48
    ref: main
    files:
      - path: packages/psu.yaml
        vars:
          prefix: ${psu3_prefix}
          name: ${psu3_name}
          command_id: ${psu3_command_id}
          response_id: ${psu3_response_id}
    refresh: 0s
